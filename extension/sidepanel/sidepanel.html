<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Netstral</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div class="brand" data-i18n="appName">Netstral</div>
    <select id="model-select" title="Modèle Mistral"></select>
    <div class="spacer"></div>
    <button id="btn-new" data-i18n-title="sp_new_chat" title="Nouvelle conversation">+</button>
  </header>

  <main id="chat"></main>

  <footer>
    <div id="error-banner" class="error hidden"></div>
    <div class="input-row">
      <textarea id="prompt" rows="2" data-i18n-ph="sp_placeholder" placeholder="Message à Netstral… (Entrée pour envoyer, Maj+Entrée pour un saut de ligne)"></textarea>
      <button id="btn-send" data-i18n-title="sp_send" title="Envoyer">&#10148;</button>
    </div>
  </footer>

  <script src="../i18n.js"></script>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
