<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Webstral</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div class="brand">Webstral</div>
    <select id="model-select" title="Modèle Mistral"></select>
    <div class="spacer"></div>
    <button id="btn-new" title="Nouvelle conversation">+</button>
    <button id="btn-options" title="Paramètres">&#9881;</button>
  </header>

  <main id="chat"></main>

  <footer>
    <div id="error-banner" class="error hidden"></div>
    <div class="input-row">
      <textarea id="prompt" rows="2" placeholder="Message à Webstral… (Entrée pour envoyer, Maj+Entrée pour un saut de ligne)"></textarea>
      <button id="btn-send" title="Envoyer">&#10148;</button>
    </div>
  </footer>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
